services:
  db:
    image: postgres:17
    container_name: readmania-db
    environment:
      POSTGRES_DB: readmania
      POSTGRES_USER: readmania
      POSTGRES_PASSWORD: readmania
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U readmania -d readmania"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - readmania-net

  db-backup:
    image: postgres:17
    container_name: readmania-db-backup
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: readmania
      PGUSER: readmania
      PGPASSWORD: readmania
      BACKUP_DIR: /backups
      RETENTION_DAYS: 14
      BACKUP_TIME: "03:00"
      RUN_ON_STARTUP: "true"
    volumes:
      - ./backups:/backups
      - ./scripts/docker-backup-daemon.sh:/usr/local/bin/docker-backup-daemon.sh:ro
    entrypoint: ["/usr/local/bin/docker-backup-daemon.sh"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - readmania-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: readmania-backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://db:5432/readmania
      DB_USERNAME: readmania
      DB_PASSWORD: readmania
      APP_INITIAL_MANAGER_EMAIL: manager@readmania.ua
      APP_INITIAL_MANAGER_PASSWORD: Manager123!
      APP_NOVAPOSHTA_API_KEY: ${APP_NOVAPOSHTA_API_KEY:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - readmania-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: readmania-frontend
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - readmania-net

volumes:
  pgdata:

networks:
  readmania-net:
    driver: bridge
