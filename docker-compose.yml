services:
  db:
    image: postgres:17
    container_name: readmania-db
    environment:
      POSTGRES_DB: readmania
      POSTGRES_USER: readmania
      POSTGRES_PASSWORD: readmania
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U readmania -d readmania"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - readmania-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: readmania-backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://db:5432/readmania
      DB_USERNAME: readmania
      DB_PASSWORD: readmania
      APP_INITIAL_MANAGER_EMAIL: manager@readmania.ua
      APP_INITIAL_MANAGER_PASSWORD: Manager123!
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - readmania-net

volumes:
  pgdata:

networks:
  readmania-net:
    driver: bridge
