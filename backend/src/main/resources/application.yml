server:
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: false

spring:
  application:
    name: readmania-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/readmania}
    username: ${DB_USERNAME:readmania}
    password: ${DB_PASSWORD:readmania}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
